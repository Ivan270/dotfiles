# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── Status Bar ────────────────────────────
set -g status-position top
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=default,fg=default"
setw -g window-status-separator ""

# Bloque izq: Nombre de sesión
set -g status-left-length 40
# Cambia a rojo (#f38ba8) al presionar Prefix (Ctrl+b)
set -g status-left "#{?client_prefix,#[bg=#f38ba8],#[bg=#89b4fa]}#[fg=#1e1e2e,bold] #S #[bg=default,fg=default] "

# Ventanas Inactivas
setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I  #W "

# Ventana Activa
setw -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #I  #W "

# Bloque Derecho: Reloj y Fecha
set -g status-right-length 50
set -g status-right "#[fg=#bac2de]%H:%M #[fg=#6c7086] - #[fg=#89b4fa]%d-%b "

# ── Pane Borders ───────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -as terminal-overrides ",xterm-ghostty:RGB"
set -s escape-time 0

# Enable squiggly undercurls and undercurl colors for LSP diagnostics
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
